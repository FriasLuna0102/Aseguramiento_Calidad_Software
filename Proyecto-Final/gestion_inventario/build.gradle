plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'com.h2database:h2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.hibernate:hibernate-envers:6.6.15.Final'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    runtimeOnly 'com.h2database:h2'


    // JWT Dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-spring:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'
    testImplementation 'net.masterthought:cucumber-reporting:5.5.0'

    // Jackson (convertir objetos a JSON)
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

// Configuración específica para Cucumber
task cucumber() {
    dependsOn assemble, testClasses
    doLast {
        javaexec {
            mainClass = 'io.cucumber.core.cli.Main'
            classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
            args = [
                    '--plugin', 'pretty',
                    '--plugin', 'html:build/cucumber-reports/Cucumber.html',
                    '--glue', 'org.example.gestion_inventario.bdd.steps',
                    'src/test/resources/features'
            ]
            systemProperty 'spring.profiles.active', 'test'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs = [
            '-XX:+EnableDynamicAgentLoading',
            '-Djdk.attach.allowAttachSelf=true'
    ]
}

test {
    useJUnitPlatform {
        excludeEngines 'cucumber'
    }
}

tasks.named('cucumber') {
    dependsOn assemble, testClasses
}

task cucumberTests() {
    dependsOn assemble, testClasses
    doLast {
        javaexec {
            mainClass = 'io.cucumber.core.cli.Main'
            classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
            args = [
                    '--plugin', 'pretty',
                    '--plugin', 'html:build/cucumber-reports/Cucumber.html',
                    '--glue', 'org.example.gestion_inventario.bdd',
                    'src/test/resources/features'
            ]
            systemProperty 'spring.profiles.active', 'test'
        }
    }
}

task testWithJacoco {
    dependsOn test, jacocoTestReport
}


jacocoTestReport {
    dependsOn test
    executionData.from = fileTree(dir: project.buildDir, includes: [
            'jacoco/test.exec'
    ])
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/bdd/**',
                    '**/*IT.*',
                    '**/*Steps.*',
                    '**/CucumberTestConfig.*'
            ])
        }))
    }
}



jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}
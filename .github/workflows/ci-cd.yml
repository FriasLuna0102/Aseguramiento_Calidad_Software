name: CI/CD Pipeline

on:
  push:
    branches:
      - frias
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Proyecto-Final/gestion_inventario

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and run unit tests
        run: ./gradlew clean build test

  deploy-test:
    if: github.ref == 'refs/heads/frias'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_rsa" \
            ./Proyecto-Final/ \
            root@${{ secrets.SERVER_IP }}:/opt/


      - name: Deploy via Docker Compose
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} << 'EOF'
            cd /opt/inventario
            echo "SPRING_DATASOURCE_USERNAME=postgres" > .env
            echo "SPRING_DATASOURCE_PASSWORD=postgres" >> .env
            docker-compose down
            docker-compose up -d --build
          EOF

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_rsa" \
            ./Proyecto-Final/ \
            root@${{ secrets.SERVER_IP }}:/opt/


      - name: Deploy via Docker Compose
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} << 'EOF'
            cd /opt/inventario
            echo "SPRING_DATASOURCE_USERNAME=postgres" > .env
            echo "SPRING_DATASOURCE_PASSWORD=postgres" >> .env
              docker-compose down
              docker-compose up -d --build
          EOF

name: CI/CD Pipeline

on:
  push:
    branches:
      - frias
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Proyecto-Final/gestion_inventario

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and run unit tests
        run: ./gradlew clean build test

  deploy-test:
    if: github.ref == 'refs/heads/frias'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_rsa" \
            ./Proyecto-Final/ \
            root@${{ secrets.SERVER_IP }}:/opt/inventario

      - name: Install Docker & Compose + Deploy
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} << 'EOF'
            # Crear directorio si no existe
            mkdir -p /opt/inventario

            # Instalar Docker si no está
            if ! command -v docker &> /dev/null; then
              apt update
              apt install -y docker.io curl
              systemctl enable --now docker
            fi

            # Instalar Docker Compose V2 si no está
            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p $DOCKER_CONFIG/cli-plugins
            if ! docker compose version &> /dev/null; then
              curl -SL https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
              chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
            fi

            # Configurar variables de entorno para Spring
            echo "SPRING_DATASOURCE_USERNAME=postgres" > /opt/inventario/.env
            echo "SPRING_DATASOURCE_PASSWORD=postgres" >> /opt/inventario/.env

            # Levantar contenedores
            cd /opt/inventario
            docker compose down || true
            docker compose up -d --build
          EOF

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_rsa" \
            ./Proyecto-Final/ \
            root@${{ secrets.SERVER_IP }}:/opt/inventario

      - name: Install Docker & Compose + Deploy
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_IP }} << 'EOF'
            mkdir -p /opt/inventario

            if ! command -v docker &> /dev/null; then
              apt update
              apt install -y docker.io curl
              systemctl enable --now docker
            fi

            DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
            mkdir -p $DOCKER_CONFIG/cli-plugins
            if ! docker compose version &> /dev/null; then
              curl -SL https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
              chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
            fi

            echo "SPRING_DATASOURCE_USERNAME=postgres" > /opt/inventario/.env
            echo "SPRING_DATASOURCE_PASSWORD=postgres" >> /opt/inventario/.env

            cd /opt/inventario
            docker compose down || true
            docker compose up -d --build
          EOF
